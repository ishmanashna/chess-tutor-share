<!doctype html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tutor de ajedrez</title>
    <script>
      try {
        const theme = localStorage.getItem("chess-tutor-theme");
        if (theme === "dark" || theme === "light") {
          document.documentElement.dataset.theme = theme;
        }
      } catch {
        /* ignore */
      }
    </script>
    <script type="module" crossorigin src="./assets/index-DoE_LnkM.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CvYbtQ85.css">
  </head>
  <body data-share="true">
    <div class="wrap">
      <header class="top-bar">
        <h1>Tutor de ajedrez</h1>
        <p id="estado" class="status top-status" aria-live="polite">Pega o sube un PGN y pulsa Analizar partida.</p>
        <div class="top-bar-actions">
          <label class="share-games" id="share-games" hidden>
            <span>Partida</span>
            <select id="share-game" aria-label="Partida"></select>
          </label>
          <button type="button" id="toggle-load" class="secondary">Cargar partida</button>
          <button type="button" id="analizar">Analizar partida</button>
          <button type="button" id="ratings-btn" class="secondary" popovertarget="ratings-view">Valoraciones</button>
          <button type="button" id="theme-toggle" class="secondary theme-toggle" aria-label="Modo oscuro" title="Modo oscuro">
            <svg class="theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M14.3 2.4a1 1 0 0 1 1.1 1.5 8 8 0 1 0 4.7 4.7 1 1 0 0 1 1.5 1.1A10 10 0 1 1 14.3 2.4Z"/>
            </svg>
            <svg class="theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M12 5a1 1 0 0 1 1 1v1a1 1 0 1 1-2 0V6a1 1 0 0 1 1-1Zm0 12a1 1 0 0 1 1 1v1a1 1 0 1 1-2 0v-1a1 1 0 0 1 1-1Zm7-5a1 1 0 0 1-1 1h-1a1 1 0 1 1 0-2h1a1 1 0 0 1 1 1ZM7 12a1 1 0 0 1-1 1H5a1 1 0 1 1 0-2h1a1 1 0 0 1 1 1Zm10.66-4.66a1 1 0 0 1 0 1.41l-.71.71a1 1 0 1 1-1.41-1.41l.71-.71a1 1 0 0 1 1.41 0ZM8.46 15.54a1 1 0 0 1 0 1.41l-.71.71a1 1 0 1 1-1.41-1.41l.71-.71a1 1 0 0 1 1.41 0Zm9.2 0a1 1 0 0 1 1.41 0l.71.71a1 1 0 1 1-1.41 1.41l-.71-.71a1 1 0 0 1 0-1.41ZM6.34 6.34a1 1 0 0 1 1.41 0l.71.71A1 1 0 1 1 7.05 8.46l-.71-.71a1 1 0 0 1 0-1.41ZM12 8.5A3.5 3.5 0 1 1 8.5 12 3.5 3.5 0 0 1 12 8.5Z"/>
            </svg>
          </button>
        </div>
      </header>

      <section class="load-panel" id="load-card" data-state="empty" data-open="true" aria-label="Cargar partida">
        <div class="load-form">
          <label for="pgn">PGN</label>
          <textarea id="pgn" rows="4" placeholder="Pega aquí el PGN de la partida"></textarea>
          <div class="load-row">
            <input type="file" id="pgn-file" accept=".pgn,text/plain,application/x-chess-pgn" hidden />
            <button type="button" id="pgn-upload" class="secondary">Subir PGN</button>
            <span id="pgn-file-name" class="file-name"></span>
            <label for="perspective">Perspectiva</label>
            <select id="perspective">
              <option value="ninguno" selected>Ninguno</option>
              <option value="blancas">Jugué con blancas</option>
              <option value="negras">Jugué con negras</option>
            </select>
          </div>
        </div>
      </section>

      <div class="watch-layout">
        <section class="col commentary-col" aria-label="Comentario">
          <article class="watch-info-card commentary-card" id="commentary-panel">
            <div class="card-head">
              <div class="commentary-tabs" role="tablist" aria-label="Comentario">
                <button type="button" role="tab" id="tab-corto" data-length="corto" aria-controls="comentario" aria-selected="true">Relato</button>
                <button type="button" role="tab" id="tab-medio" data-length="medio" aria-controls="comentario" aria-selected="false">Claves</button>
                <button type="button" role="tab" id="tab-largo" data-length="largo" aria-controls="comentario" aria-selected="false">Guía</button>
                <button type="button" role="tab" id="tab-blancas" data-length="blancas" aria-controls="comentario" aria-selected="false">Blancas</button>
                <button type="button" role="tab" id="tab-negras" data-length="negras" aria-controls="comentario" aria-selected="false">Negras</button>
              </div>
            </div>
            <div id="comentario" class="commentary-body" role="tabpanel" aria-labelledby="tab-corto"></div>
          </article>
        </section>

        <section class="col board-col" aria-label="Tablero">
          <div class="board-stack">
            <div class="board-row">
              <div class="eval-col" id="eval-col" data-orientation="white" data-enabled="false">
                <div class="eval-track">
                  <div class="eval-black" id="eval-black"></div>
                </div>
                <div class="eval-score" id="eval-score" aria-hidden="true"></div>
              </div>
              <div class="board-wrap">
                <div id="board" class="cg-wrap"></div>
              </div>
            </div>
            <div class="board-toolbar">
              <div class="board-toolbar-main">
                <button type="button" id="game-info-btn" class="secondary game-info-btn" popovertarget="game-info" tabindex="-1">
                  Información
                </button>
                <div class="nav-buttons">
                  <button type="button" id="nav-first" data-nav="first" tabindex="-1" aria-label="Inicio" title="Inicio">«</button>
                  <button type="button" id="nav-prev" data-nav="prev" tabindex="-1" aria-label="Anterior" title="Anterior">‹</button>
                  <button type="button" id="nav-next" data-nav="next" tabindex="-1" aria-label="Siguiente" title="Siguiente">›</button>
                  <button type="button" id="nav-last" data-nav="last" tabindex="-1" aria-label="Final" title="Final">»</button>
                </div>
                <div class="board-toolbar-end">
                  <button type="button" id="flip" class="secondary flip-btn" tabindex="-1">Invertir</button>
                </div>
              </div>
            </div>
          </div>
          <article class="game-info-pop" id="game-info" popover>
            <h2>Información</h2>
            <p class="game-info-brief" id="info-brief">—</p>
            <dl class="watch-meta-grid">
              <dt>Blancas</dt>
              <dd id="info-white">—</dd>
              <dt>Negras</dt>
              <dd id="info-black">—</dd>
              <dt>Resultado</dt>
              <dd id="info-result">—</dd>
              <dt>Apertura</dt>
              <dd class="meta-opening" id="info-opening">—</dd>
              <dt>Precisión (B)</dt>
              <dd id="info-white-accuracy">—</dd>
              <dt>Rendimiento (B)</dt>
              <dd id="info-white-performance">—</dd>
              <dt>Precisión (N)</dt>
              <dd id="info-black-accuracy">—</dd>
              <dt>Rendimiento (N)</dt>
              <dd id="info-black-performance">—</dd>
            </dl>
          </article>
          <div class="side-banner" id="side-banner" hidden>
            <p class="side-banner-label" id="side-banner-label">Ejemplo</p>
            <button type="button" id="side-back">Volver a la partida</button>
          </div>
        </section>

        <section class="col info-col" aria-label="Motor y jugadas">
          <article class="watch-info-card engine-card" id="engine-panel" aria-label="Motor">
            <div class="engine-head">
              <h2>Motor <span id="engine-depth" class="engine-depth-mini"></span></h2>
              <div class="engine-head-actions">
                <button type="button" id="engine-options-btn" class="engine-options-btn" popovertarget="engine-options" aria-label="Opciones del motor" title="Opciones">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="currentColor" d="M10.3 3.2 9.8 5.6a6.8 6.8 0 0 0-1.5.9L5.9 5.7 3.7 7.9l.8 2.4a6.8 6.8 0 0 0 0 3.4l-.8 2.4 2.2 2.2 2.4-.8c.47.35.97.65 1.5.9l.5 2.4h3.4l.5-2.4c.53-.25 1.03-.55 1.5-.9l2.4.8 2.2-2.2-.8-2.4a6.8 6.8 0 0 0 0-3.4l.8-2.4-2.2-2.2-2.4.8a6.8 6.8 0 0 0-1.5-.9L13.7 3.2h-3.4ZM12 9.2A2.8 2.8 0 1 1 9.2 12 2.8 2.8 0 0 1 12 9.2Z"/>
                  </svg>
                </button>
                <label class="engine-toggle" for="engine-on">
                  <input type="checkbox" id="engine-on" checked />
                  <span id="engine-toggle-label">Encendido</span>
                </label>
              </div>
            </div>
            <div class="engine-options-pop" id="engine-options" popover>
              <label>
                Líneas
                <select id="engine-opt-lines" aria-label="Número de líneas">
                  <option value="1">1</option>
                  <option value="2">2</option>
                  <option value="3" selected>3</option>
                  <option value="4">4</option>
                  <option value="5">5</option>
                </select>
              </label>
              <label>
                Profundidad
                <select id="engine-opt-depth" aria-label="Profundidad máxima">
                  <option value="0" selected>Sin límite</option>
                  <option value="12">12</option>
                  <option value="16">16</option>
                  <option value="20">20</option>
                  <option value="24">24</option>
                  <option value="28">28</option>
                </select>
              </label>
              <label>
                Tiempo
                <select id="engine-opt-time" aria-label="Tiempo máximo">
                  <option value="0" selected>Sin límite</option>
                  <option value="1000">1 s</option>
                  <option value="3000">3 s</option>
                  <option value="5000">5 s</option>
                  <option value="8000">8 s</option>
                </select>
              </label>
            </div>
            <ol class="engine-lines" id="engine-lines">
              <li class="engine-empty">Cargando motor…</li>
            </ol>
          </article>
          <article class="watch-info-card moves-card" aria-label="Jugadas">
            <h2>Jugadas</h2>
            <div class="moves-scroll" id="move-tree"></div>
          </article>
        </section>
      </div>
      <article class="ratings-pop" id="ratings-view" popover>
        <h2>Valoraciones</h2>
        <div id="ratings-body"></div>
      </article>
    </div>
  </body>
</html>
